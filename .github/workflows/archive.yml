name: Archive PDF

on:
  schedule:
    # Runs every Tuesday at 6:00 PM EDT (10:00 PM UTC)
    - cron: '0 22 * * 2'
  workflow_dispatch:

jobs:
  archive-pdf:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download PDF from Google Drive
        env:
          DRIVE_URL: https://drive.google.com/uc?export=download&id=1vV9V4qaenwJSOy_wc4SVtbxyLjmGZy_m
        run: |
          # Extract the file ID from the Google Drive URL
          # The tinyurl redirects to a Google Drive share link
          curl -L "$DRIVE_URL" -o /tmp/session.pdf
      
      - name: Create archive directory if it doesn't exist
        run: mkdir -p archive
      
      - name: Save PDF with timestamp
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          cp /tmp/session.pdf "archive/irish-trad-session_${TIMESTAMP}.pdf"
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add archive/
          
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Archive Irish trad session PDF - $(date +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi
      
      - name: Create release and tag
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          TAG_NAME="archive-${TIMESTAMP}"
          RELEASE_NAME="Archive - $(date +%Y-%m-%d)"
          
          # Create the tag
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          
          # Create the release with the archived PDF
          gh release create "$TAG_NAME" \
            "archive/irish-trad-session_${TIMESTAMP}.pdf" \
            --title "$RELEASE_NAME" \
            --notes "Automated archive of Irish trad session PDF"
